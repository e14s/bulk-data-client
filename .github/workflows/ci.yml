name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    name: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test with coverage
        run: npm test

      # Coverage floor is a ratchet: it starts at the measured baseline and is
      # raised as coverage improves. Policy target is 90% lines (SDLC section 8).
      - name: Enforce coverage baseline
        run: npx nyc check-coverage --lines 72 --statements 72 --functions 73 --branches 57

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: warn
